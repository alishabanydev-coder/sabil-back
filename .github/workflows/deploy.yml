name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load the deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust this server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Copy the code to the server
        run: |
          rsync -az --delete \
            --exclude node_modules \
            --exclude .git \
            --exclude .env \
            --exclude .env.* \
            --exclude uploads \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/backend/sabil-back/

      - name: Install and reload
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cd /var/www/backend/sabil-back && npm ci --omit=dev && pm2 reload backend"

      - name: Record deploy and notify
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STATUS="${{ job.status }}"
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cat > /root/deploy-status.json" <<EOF
          {"finishedAt":"$(date -Iseconds)","ok":$([ "$STATUS" = "success" ] && echo true || echo false),"target":"backend"}
          EOF
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🚀 [CI/CD DEPLOY]
          Target: backend
          Result: ${STATUS}"